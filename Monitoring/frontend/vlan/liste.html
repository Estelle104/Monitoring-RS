<title>Liste des VLANs</title>

<div class="px-6 py-8 flex-1 flex flex-col gap-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div class="flex-1">
      <h1 class="text-3xl font-bold dark:text-white mb-4">Liste des VLANs</h1>
      <div class="flex items-center gap-4">
        <div class="relative group">
          <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 transition-colors"
            style="color:var(--text-muted)">search</span>
          <input id="searchVlanInput"
            class="w-full md:w-80 pl-10 pr-4 py-2.5 dark:bg-card-dark border border-slate-200 dark:border-slate-700 rounded-md focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
            style="color:var(--text)" placeholder="Rechercher un VLAN…" type="text" />
        </div>
        <p class="mt-2 text-sm" id="countVlans" style="color:var(--text-muted)">0 éléments</p>
      </div>
    </div>
    <div class="self-end md:self-center">
      <button onclick="loadPageContent('vlan/AddVlan.html')"
        class="bg-primary font-bold py-2.5 px-6 rounded-md transition-colors text-sm uppercase tracking-wide hover:opacity-90 whitespace-nowrap"
        style="color:#001925; border:none; cursor:pointer;">Ajouter un VLAN</button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="vlansGrid"></div>
</div>

<script>
  var API_BASE = 'http://localhost:8000/api';
  let allVlans = [];

  window.loadVlans = async function () {
    try {
      const response = await fetch(API_BASE + '/vlans');
      const result = await response.json();
      if (result.status === 'ok' && result.data) {
        allVlans = result.data;
        window.displayVlans(allVlans);
      } else {
        console.error('Erreur:', result);
      }
    } catch (error) {
      console.error('Erreur lors du chargement des VLANs:', error);
    }
  };

  window.setupVlanSearch = function () {
    const searchInput = document.getElementById('searchVlanInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        if (term === '') {
          window.displayVlans(allVlans);
        } else {
          const filtered = allVlans.filter(v =>
            (v.vlan && v.vlan.toString().includes(term)) ||
            (v.ip && v.ip.toLowerCase().includes(term)) ||
            (v.id && v.id.toLowerCase().includes(term))
          );
          window.displayVlans(filtered);
        }
      });
    }
  };

  window.displayVlans = async function (vlans) {
    const grid = document.getElementById('vlansGrid');
    const countEl = document.getElementById('countVlans');

    if (!grid || !countEl) return;

    grid.innerHTML = '';

    if (vlans.length === 0) {
      grid.innerHTML =
        '<p class="text-center col-span-full" style="color:var(--text-muted)">Aucun VLAN trouvé</p>';
      countEl.textContent = '0 éléments';
      return;
    }

    countEl.textContent =
      vlans.length + ' élément' + (vlans.length > 1 ? 's' : '');

    // ==========================================================
    // SCANNER TOUS LES VLAN EN PARALLÈLE
    // ==========================================================

    const vlansAvecAppareils = await Promise.all(
      vlans.map(async (vlan) => {

        const subnet = vlan.ip || '0.0.0.0/24';

        const vlanInterface =
          'eno1.' + String(vlan.vlan).padStart(4, '0');

        let nbAppareilsActifs = 0;

        try {

          const response = await fetch(
            AD_API_BASE +
            '/firewall/scan?network=' +
            encodeURIComponent(subnet) +
            '&interface=' +
            encodeURIComponent(vlanInterface)
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const appareils = await response.json();

          if (Array.isArray(appareils)) {
            nbAppareilsActifs = appareils.length;
          }

        } catch (error) {

          console.error(
            `Erreur scan VLAN ${vlan.vlan}:`,
            error
          );

          nbAppareilsActifs = 0;
        }

        return {
          ...vlan,
          nbAppareilsActifs: nbAppareilsActifs
        };
      })
    );


    // ==========================================================
    // AFFICHAGE DES VLAN
    // ==========================================================

    vlansAvecAppareils.forEach((vlan, index) => {

      const card = document.createElement('div');

      card.className =
        'dark:bg-card-dark rounded-lg p-5 border dark:border-slate-700/50 shadow-sm hover:shadow-md transition-shadow group cursor-pointer';

      card.style.borderTop =
        '4px solid var(--chartreuse)';


      // ========================================================
      // PARAMÈTRES POUR LE CLIC
      // ========================================================

      const subnet = vlan.ip || '0.0.0.0/24';

      const vlanInterface =
        'eno1.' + String(vlan.vlan).padStart(4, '0');

      card.onclick = function () {

        window.scanVlanParams = {
          subnet: subnet,
          vlan: vlan.vlan,
          salle: vlan.salle,
          interface: vlanInterface
        };

        loadPageContent('device/all-devices.html');
      };


      // ========================================================
      // TEXTE APPAREILS ACTIFS
      // ========================================================

      const nbAppareils = vlan.nbAppareilsActifs;


      // ========================================================
      // HTML DE LA CARTE
      // ========================================================

      card.innerHTML = [

        '<div class="flex justify-between items-start mb-6">',

        '  <h3 class="text-lg font-semibold dark:text-white group-hover:text-primary transition-colors">',
        '    VLAN ' + vlan.vlan,
        '  </h3>',

        '  <span class="material-icons-outlined text-sm" style="color:var(--chartreuse)">lan</span>',

        '</div>',


        // ------------------------------------------------------
        // SALLE
        // ------------------------------------------------------

        '<div class="mb-4 pb-4 border-b dark:border-slate-700/50">',

        '  <p class="text-[10px] uppercase font-bold mb-2" style="color:var(--text-muted)">',
        '    Salle',
        '  </p>',

        '  <span class="text-sm font-semibold dark:text-white">',
        '    ' + (vlan.salle || 'Non assignée'),
        '  </span>',

        '</div>',


        // ------------------------------------------------------
        // INFORMATIONS VLAN
        // ------------------------------------------------------

        '<div class="grid grid-cols-2 gap-4 mb-6">',

        '  <div>',

        '    <p class="text-[10px] uppercase font-bold mb-2" style="color:var(--text-muted)">',
        '      Adresse Réseau',
        '    </p>',

        '    <span class="text-sm font-mono font-bold dark:text-white">',
        '      ' + subnet,
        '    </span>',

        '  </div>',


        '  <div>',

        '    <p class="text-[10px] uppercase font-bold mb-2" style="color:var(--text-muted)">',
        '      ID',
        '    </p>',

        '    <span class="text-sm font-mono dark:text-white">',
        '      ' + vlan.id,
        '    </span>',

        '  </div>',

        '</div>',


        // ------------------------------------------------------
        // APPAREILS ACTIFS
        // ------------------------------------------------------

        '<div class="mb-6 p-3 rounded-lg" style="background:var(--bg-secondary, rgba(128,128,128,0.08))">',

        '  <div class="flex items-center justify-between">',

        '    <div class="flex items-center gap-2">',

        '      <span class="material-icons-outlined text-base" style="color:var(--chartreuse)">devices</span>',

        '      <span class="text-[10px] uppercase font-bold" style="color:var(--text-muted)">',
        '        Appareils actifs',
        '      </span>',

        '    </div>',

        '    <span class="text-2xl font-bold dark:text-white">',
        '      ' + nbAppareils,
        '    </span>',

        '  </div>',

        '</div>',


        // ------------------------------------------------------
        // FOOTER
        // ------------------------------------------------------

        '<div class="pt-4 border-t dark:border-slate-700/50 flex items-center justify-between">',

        '  <div class="flex items-center gap-2">',

        '    <span class="material-icons-outlined text-sm" style="color:var(--chartreuse)">radar</span>',

        '    <span class="text-xs font-medium" style="color:var(--text-muted)">',
        '      Cliquer pour scanner',
        '    </span>',

        '  </div>',

        '  <span class="material-icons-outlined text-base" style="color:var(--chartreuse)">arrow_forward</span>',

        '</div>'

      ].join('\n');


      grid.appendChild(card);

    });
  };

  window.loadVlans();
  window.setupVlanSearch();
</script>
