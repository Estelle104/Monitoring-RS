<title>Liste des Salles</title>

<div class="px-6 py-8 flex-1 flex flex-col gap-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div class="flex-1">
      <h1 class="text-3xl font-bold dark:text-white mb-4">Liste des Salles</h1>
      <div class="flex items-center gap-4">
        <div class="relative group">
          <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 transition-colors" style="color:var(--text-muted)">search</span>
          <input id="searchInput" class="w-full md:w-80 pl-10 pr-4 py-2.5 dark:bg-card-dark border border-slate-200 dark:border-slate-700 rounded-md focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" style="color:var(--text)" placeholder="Recherche de salles" type="text" />
        </div>
        <p class="mt-2 text-sm" id="countSalles" style="color:var(--text-muted)">0 éléments</p>
      </div>
    </div>
    <div class="self-end md:self-center flex flex-col gap-2" style="display: flex;">
      <button onclick="loadPageContent('salle/addSalle.html')" class="bg-primary font-bold py-2.5 px-6 rounded-md transition-colors text-sm uppercase tracking-wide hover:opacity-90 whitespace-nowrap" style="color:#001925; border:none; cursor:pointer;">Ajouter une salle</button>
      <button onclick="loadPageContent('vlan/AddVlan.html')" class="font-bold py-2.5 px-6 rounded-md transition-colors text-sm uppercase tracking-wide hover:opacity-90 whitespace-nowrap" style="color:var(--chartreuse); border:1px solid var(--chartreuse); cursor:pointer; background:transparent;">Ajouter un VLAN</button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="sallesGrid"></div>
</div>

<script>
  let allSalles = [];

  const ports = ['gi1/0/2', 'gi1/0/3', 'gi1/0/4', 'gi1/0/5', 'gi1/0/7', 'gi1/0/7', 'gi1/0/8', 'gi1/0/9', '', 'gi1/0/11'];

  
  
  window.loadSalles = async function() {
    try {
      const response = await fetch('http://localhost:8000/api/salles');
      const result = await response.json();
      if (result.status === 'ok' && result.data) {
        allSalles = result.data;
        await window.displaySalles(allSalles);
      } else {
        console.error('Erreur:', result);
      }
    } catch (error) {
      console.error('Erreur lors du chargement des salles:', error);
    }
  };

  window.setupSearch = function() {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase().trim();
        if (searchTerm === '') {
          window.displaySalles(allSalles);
        } else {
          const filtered = allSalles.filter(salle => 
            (salle.salle && salle.salle.toLowerCase().includes(searchTerm)) ||
            (salle.id && salle.id.toString().toLowerCase().includes(searchTerm))
          );
          window.displaySalles(filtered);
        }
      });
    }
  };

  window.displaySalles = async function(salles) {
    const grid = document.getElementById('sallesGrid');
    const countElement = document.getElementById('countSalles');
    
    if (!grid || !countElement) {
      console.error('Éléments DOM non trouvés');
      return;
    }
    
    grid.innerHTML = '';
    if (salles.length === 0) {
      grid.innerHTML = '<p class="text-center col-span-full" style="color:var(--text-muted)">Aucune salle trouvée</p>';
      countElement.textContent = '0 éléments';
      return;
    }
    countElement.textContent = `${salles.length} élément${salles.length > 1 ? 's' : ''}`;
    for (const [index, salle] of salles.entries()) {
      const card = document.createElement('div');
      card.className = 'dark:bg-card-dark rounded-lg p-5 border dark:border-slate-700/50 shadow-sm hover:shadow-md transition-shadow group cursor-pointer';
      const isOnline = index % 2 === 0;
      if (isOnline) card.style.borderTop = '4px solid var(--chartreuse)';
      const statusColor = isOnline ? 'var(--chartreuse)' : '#ef4444';
      const statusIcon = isOnline ? 'cloud_done' : 'leak_remove';
      const statusText = isOnline ? 'En ligne' : 'Hors ligne';

      let port = ports[index % ports.length];

      let vlan = '';
      try {
        const vlanResponse = await fetch(`http://localhost:8000/api/vlans/salle/${salle.id}`);
        const vlanResult = await vlanResponse.json();
        if (vlanResult && vlanResult.status === 'ok' && vlanResult.data) {
          const v = vlanResult.data;
          vlan = v.vlan || v.id || '';
        } else {
          // pas de VLAN associé
          vlan = '';
        }
      } catch (error) {
        console.error('Erreur lors du chargement du VLAN pour la salle', salle.id, error);
        vlan = '';
      }

      card.innerHTML = `
        <div class="flex justify-between items-start mb-6">
          <h3 class="text-lg font-semibold dark:text-white group-hover:text-primary transition-colors">${salle.salle || 'Salle ' + salle.id}</h3>
          <span class="w-3 h-3 rounded-full flex-shrink-0" style="background:${statusColor}"></span>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <p class="text-[10px] uppercase font-bold mb-2" style="color:var(--text-muted)">Appareils Connectés</p>
            <span class="text-3xl font-bold dark:text-white">0</span>
            <p class="text-xs mt-1" style="color:var(--text-muted)">Non disponible</p>
          </div>
          <div>
            <p class="text-[10px] uppercase font-bold mb-2" style="color:var(--text-muted)">Vlan</p>
            <span class="text-3xl font-bold dark:text-white">${vlan || 'Aucun'}</span>
            <p class="text-xs mt-1" style="color:var(--text-muted)">Aucune</p>
          </div>
        </div>
        <div class="pt-4 border-t dark:border-slate-700/50 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div>
              <p class="text-[15px] font-bold leading-tight" style="color:var(--text)">Port</p>
              <p class="text-[12px]" style="color:var(--text-muted)">${port}</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5" style="color:${statusColor}">
            <span class="material-icons-outlined text-base">${statusIcon}</span>
            <span class="text-sm font-medium">${statusText}</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }
  };
  
  // Charger les salles puis initialiser la recherche
  window.loadSalles().then(() => window.setupSearch()).catch(err => console.error(err));
</script>
