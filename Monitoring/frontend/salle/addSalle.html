<title>Ajouter une Salle</title>

<div class="px-6 py-8 max-w-4xl">
  <div class="mb-8">
    <h1 class="text-3xl font-bold dark:text-white mb-2">Ajouter une nouvelle Salle</h1>
    <p class="text-sm" style="color:var(--text-muted)">Remplissez les informations puis cliquez sur Créer</p>
  </div>

  <div class="dark:bg-card-dark rounded-lg p-6 border dark:border-slate-700/50">
    <form class="space-y-6" onsubmit="return false;">
      <div>
        <label for="room-name" class="block text-sm font-medium dark:text-white mb-2">Nom de la salle</label>
        <input 
          type="text" 
          id="room-name" 
          placeholder="Ex: Salle A-101"
          class="w-full px-4 py-2.5 dark:bg-[var(--ink)] border dark:border-slate-700 rounded-md focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
          style="color:var(--text)"
        />
      </div>

      <div>
        <label for="room-location" class="block text-sm font-medium dark:text-white mb-2">Localisation</label>
        <input 
          type="text" 
          id="room-location" 
          placeholder="Ex: Bâtiment 1, Étage 2"
          class="w-full px-4 py-2.5 dark:bg-[var(--ink)] border dark:border-slate-700 rounded-md focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
          style="color:var(--text)"
        />
      </div>

      <div>
        <label for="room-description" class="block text-sm font-medium dark:text-white mb-2">Description (optionnel)</label>
        <textarea 
          id="room-description" 
          placeholder="Description de la salle..."
          rows="4"
          class="w-full px-4 py-2.5 dark:bg-[var(--ink)] border dark:border-slate-700 rounded-md focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all resize-none"
          style="color:var(--text)"
        ></textarea>
      </div>

      <div class="flex gap-4 pt-4">
        <button 
          onclick="createSalle()" 
          type="button"
          class="px-6 py-2.5 rounded-md font-bold transition-colors text-sm uppercase tracking-wide"
          style="background:var(--chartreuse); color:#001925; border:none; cursor:pointer;">
          Créer la Salle
        </button>
        <button 
          onclick="loadPageContent('salle/liste.html')" 
          type="button"
          class="px-6 py-2.5 rounded-md font-bold transition-colors text-sm uppercase tracking-wide"
          style="background:rgba(202,244,56,0.1); color:var(--chartreuse); border:none; cursor:pointer;">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  window.createSalle = function() {
    const roomName = document.getElementById('room-name').value.trim();
    if (!roomName) {
      alert("Le nom de la salle est requis.");
      return;
    }

    fetch('http://localhost:8000/api/salles/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ salle: roomName })
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'ok') {
        alert(`Salle créée avec succès ! ID: ${data.data.id}`);
        // Réinitialiser le formulaire
        document.getElementById('room-name').value = '';
        document.getElementById('room-location').value = '';
        document.getElementById('room-description').value = '';
        // Charger la liste avec un délai pour que l'alerte se ferme
        setTimeout(() => {
          window.loadPageContent('salle/liste.html');
        }, 100);
      } else {
        alert("Erreur lors de la création de la salle: " + (data.detail || "Erreur inconnue"));
      }
    })
    .catch(error => {
      console.error("Erreur:", error);
      alert("Une erreur est survenue lors de la création de la salle: " + error.message);
    });
  };
</script>
