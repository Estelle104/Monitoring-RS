<title>Liste des Quotas</title>

<div class="px-6 py-8 flex-1 flex flex-col gap-6">

  <!-- En-tête + bouton Ajouter -->
  <div class="flex flex-col xl:flex-row xl:items-end xl:justify-between gap-6">
    <div>
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center"
             style="background:rgba(190,255,45,0.12);">
          <span class="material-icons-outlined" style="color:var(--chartreuse);">data_usage</span>
        </div>
        <div>
          <h1 class="text-3xl font-bold dark:text-white">Gestion des quotas</h1>
          <p class="text-sm mt-1" style="color:var(--text-muted)">
            Gérez les limites de connexion par type d'utilisateurs
          </p>
        </div>
      </div>
    </div>

    <button
      onclick="loadPageContent('quota/addQuota.html')"
      class="font-bold py-3 px-6 rounded-lg transition-all text-sm uppercase tracking-wide flex items-center justify-center gap-2"
      style="color:#001925; background:var(--chartreuse); border:none; cursor:pointer; box-shadow:0 6px 20px rgba(190,255,45,0.15);"
      onmouseover="this.style.transform='translateY(-2px)'"
      onmouseout="this.style.transform='translateY(0)'">
      <span class="material-icons-outlined text-lg">add</span>
      Ajouter un quota
    </button>
  </div>

  <!-- Statistiques -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="rounded-xl p-5 border"
         style="background:rgba(8,39,45,0.75); border-color:rgba(190,255,45,0.12);">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs uppercase font-bold tracking-wider" style="color:var(--text-muted)">Quotas configurés</p>
          <p id="totalQuotaStat" class="text-2xl font-bold text-white mt-2">0</p>
        </div>
        <div class="w-11 h-11 rounded-lg flex items-center justify-center"
             style="background:rgba(190,255,45,0.1)">
          <span class="material-icons-outlined" style="color:var(--chartreuse)">dns</span>
        </div>
      </div>
    </div>

    <div class="rounded-xl p-5 border"
         style="background:rgba(8,39,45,0.75); border-color:rgba(190,255,45,0.12);">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs uppercase font-bold tracking-wider" style="color:var(--text-muted)">Types concernés</p>
          <p id="totalTypesStat" class="text-2xl font-bold text-white mt-2">0</p>
        </div>
        <div class="w-11 h-11 rounded-lg flex items-center justify-center"
             style="background:rgba(190,255,45,0.1)">
          <span class="material-icons-outlined" style="color:var(--chartreuse)">groups</span>
        </div>
      </div>
    </div>

    <div class="rounded-xl p-5 border"
         style="background:rgba(8,39,45,0.75); border-color:rgba(190,255,45,0.12);">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs uppercase font-bold tracking-wider" style="color:var(--text-muted)">Capacité totale</p>
          <p id="totalBytesStat" class="text-2xl font-bold text-white mt-2">0</p>
        </div>
        <div class="w-11 h-11 rounded-lg flex items-center justify-center"
             style="background:rgba(190,255,45,0.1)">
          <span class="material-icons-outlined" style="color:var(--chartreuse)">cloud</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Barre de recherche -->
  <div class="rounded-xl p-4 border"
       style="background:rgba(8,39,45,0.55); border-color:rgba(255,255,255,0.06);">
    <div class="flex flex-col md:flex-row md:items-center gap-4">
      <div class="relative flex-1">
        <span class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2"
              style="color:var(--text-muted)">search</span>
        <input
          id="searchInput"
          type="text"
          placeholder="Rechercher par type d'utilisateur, quota ou limite..."
          class="w-full pl-12 pr-4 py-3 rounded-lg outline-none transition-all"
          style="color:var(--text); background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.08);"
        />
      </div>
      <div class="flex items-center gap-2 px-4 py-2 rounded-lg"
           style="background:rgba(190,255,45,0.07)">
        <span class="material-icons-outlined text-sm" style="color:var(--chartreuse)">filter_list</span>
        <span id="countQuotas" class="text-sm" style="color:var(--text-muted)">0 élément</span>
      </div>
    </div>
  </div>

  <!-- Grille des cartes -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5" id="quotasGrid"></div>

</div>

<script>
(() => {
  const { apiDelete } = window.QuotaShared;

  let allQuota = [];

  /* ── Statistiques ─────────────────────────────────────── */
  function updateStatistics(quotas, summary = {}) {
    document.getElementById('totalQuotaStat').textContent = quotas.length || '0';
    document.getElementById('totalTypesStat').textContent =
      quotas.length ? new Set(quotas.map(q => q.type_user)).size : '0';
    document.getElementById('totalBytesStat').textContent =
      summary.formatted_total_quota || '0 Bytes';
  }

  /* ── Rendu des cartes ─────────────────────────────────── */
  window.displayQuota = function(quotas) {
    const grid         = document.getElementById('quotasGrid');
    const countElement = document.getElementById('countQuotas');
    if (!grid || !countElement) return;

    grid.innerHTML = '';

    if (quotas.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full rounded-xl p-12 text-center border"
             style="background:rgba(8,39,45,0.5); border-color:rgba(255,255,255,0.06);">
          <p class="text-lg font-semibold text-white">Aucun quota trouvé</p>
        </div>`;
      countElement.textContent = '0 élément';
      return;
    }

    countElement.textContent = `${quotas.length} élément${quotas.length > 1 ? 's' : ''}`;

    quotas.forEach(quota => {
      const card = document.createElement('div');
      card.className = 'quota-card';

      card.innerHTML = `
        <div class="px-5 pt-5 pb-4" style="border-bottom:1px solid rgba(255,255,255,0.06);">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl flex items-center justify-center"
                   style="background:rgba(190,255,45,0.10);">
                <span class="material-icons-outlined" style="color:var(--chartreuse)">network_check</span>
              </div>
              <h3 class="text-lg font-bold text-white">
                <span class="material-icons-outlined text-base" style="color:var(--text-muted)">person</span>
                <span class="px-3 py-1 rounded-full text-xs font-bold"
                      style="color:var(--chartreuse); background:rgba(190,255,45,0.09);">
                  ${quota.type_user || 'Aucun'}
                </span>
              </h3>
            </div>
            <span class="w-3 h-3 rounded-full mt-2"
                  style="background:var(--chartreuse); box-shadow:0 0 10px rgba(190,255,45,0.5);"></span>
          </div>
        </div>

        <div class="px-5 py-5">
          <div class="mb-4">
            <p class="text-xs mb-1" style="color:var(--text-muted)">Limite de données</p>
            <span class="text-3xl font-bold dark:text-white">
              ${quota.formatted_quota_limite || '0 Bytes'}
            </span>
          </div>
          <div class="flex items-center justify-between pt-3"
               style="border-top:1px solid rgba(255,255,255,0.05);">
            <span class="text-xs" style="color:var(--text-muted)">
              ${Number(quota.quota_limite || 0).toLocaleString('fr-FR')} Bytes
            </span>
          </div>
          <div class="flex gap-2 mt-4">
            <button
              onclick="editQuota(${JSON.stringify(quota).split('"').join('&quot;')})"
              style="flex:1; padding:6px 12px; border-radius:8px; background:rgba(74,222,128,0.1);
                     color:#4ade80; border:1px solid rgba(74,222,128,0.3); cursor:pointer;
                     font-size:0.85rem; font-weight:500;">
              Modifier
            </button>
            <button
              onclick="deleteQuota(${quota.id})"
              style="flex:1; padding:6px 12px; border-radius:8px; background:rgba(248,113,113,0.1);
                     color:#f87171; border:1px solid rgba(248,113,113,0.3); cursor:pointer;
                     font-size:0.85rem; font-weight:500;">
              Supprimer
            </button>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });
  };

  /* ── Chargement des quotas ────────────────────────────── */
  window.loadQuota = async function() {
    try {
      const response = await fetch('http://localhost:8000/api/quota');
      const result   = await response.json();
      if (result.status !== 'ok' || !result.data) {
        console.error('Erreur lors du chargement des quotas', result);
        return;
      }

      // Enrichissement : récupération du nom de type pour chaque quota
      const enrichedQuotas = await Promise.all(
        result.data.map(async quota => {
          let type_user = 'Aucun';
          try {
            const res  = await fetch(`http://localhost:8000/api/type_user/${quota.id_type_user}`);
            const json = await res.json();
            if (json?.status === 'ok' && json.data) {
              type_user = json.data.type_user || json.data.id || 'Aucun';
            }
          } catch (e) {
            console.error('Erreur type_user pour quota', quota.id, e);
          }
          return { ...quota, type_user: String(type_user) };
        })
      );

      allQuota = enrichedQuotas;
      updateStatistics(allQuota, result.summary || {});
      displayQuota(allQuota);

    } catch (error) {
      console.error('Erreur lors du chargement des quotas:', error);
    }
  };

  /* ── Recherche ────────────────────────────────────────── */
  window.setupSearch = function() {
    const input = document.getElementById('searchInput');
    if (!input) return;
    input.addEventListener('input', e => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) { displayQuota(allQuota); return; }
      displayQuota(allQuota.filter(q =>
        [q.id, q.id_type_user, q.type_user, q.quota_limite, q.formatted_quota_limite]
          .some(v => String(v || '').toLowerCase().includes(term))
      ));
    });
  };

  /* ── Actions sur les cartes ───────────────────────────── */
  window.editQuota = function(quota) {
    localStorage.setItem('quotaData', JSON.stringify(quota));
    loadPageContent('quota/editQuota.html');
  };

  window.deleteQuota = function(id) {
    apiDelete(`http://localhost:8000/api/quota/${id}`, () => window.loadQuota());
  };

  /* ── Initialisation ───────────────────────────────────── */
  window.loadQuota().then(() => window.setupSearch()).catch(console.error);
})();
</script>
