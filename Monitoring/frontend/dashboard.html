<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet" />
<script>
  // Charge chart.js
  function loadChartJS(cb) {
    if (window.Chart) { cb(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js';
    s.onload = cb;
    document.head.appendChild(s);
  }

  function initDashboard() {
    // effet au survol des stats
    document.querySelectorAll('.stat-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-3px)';
        card.style.boxShadow = '0 8px 30px rgba(0,0,0,0.3)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
        card.style.boxShadow = '';
      });
    });

    // Recupere le nb des salles
    async function loadActiveSalles() {
      try {
        const response = await fetch('http://localhost:8000/api/salles');
        const result = await response.json();
        if (result.status === 'ok' && result.data) {
          document.getElementById('activeSalles').textContent = result.data.length;
        }
      } catch (error) {
        document.getElementById('activeSalles').textContent = '9';
      }
    }
    loadActiveSalles();

    // Données du graphique de variation réseau


    // nb max points a afficher sur le graphique
    const MAX_POINTS = 40;
    // Seuil à partir duquel on considère le débit comme critique
    const THRESHOLD_MBPS = 800;
    // Valeur maximale affichée sur l'axe Y
    const MAX_BW_MBPS = 600;
    // Interfaces réseau surveillées
    const interfaceNames = ['enp7s0', 'enp4s0'];
    // Couleurs des interfaces
    const interfaceColors = {
      enp7s0: '#f43838',
      enp4s0: '#7efb5c'
    };

    // Génère des valeurs initiales pour remplir le graphique
    const variationData = {
      enp7s0: Array.from({ length: MAX_POINTS }, (_, i) => Math.round(35 + Math.sin(i * 0.32) * 10 + Math.random() * 8)),
      enp4s0: Array.from({ length: MAX_POINTS }, (_, i) => Math.round(18 + Math.cos(i * 0.28) * 8 + Math.random() * 6))
    };

    const variationLabels = Array.from({ length: MAX_POINTS }, (_, i) => {
      const s = MAX_POINTS - i;
      return s % 5 === 0 ? `-${s}s` : '';
    });

    // Crée une ligne contenant la même valeur du seuil critique
    const thresholdData = Array(MAX_POINTS).fill(THRESHOLD_MBPS);

    const vCtx = document.getElementById('variationChart');
    let variationChart;
    if (vCtx) {
      // Création du graphique de variation du débit des interfaces
      variationChart = new Chart(vCtx, {
        type: 'line',
        data: {
          labels: variationLabels,
          datasets: [
            {
              // Débit de l'interface enp7s0
              
              label: 'enp7s0',
              data: variationData.enp7s0,
              borderColor: interfaceColors.enp7s0,
              backgroundColor: (ctx) => {
                const chart = ctx.chart;
                const { ctx: c, chartArea } = chart;
                if (!chartArea) return 'transparent';
                const gradient = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                gradient.addColorStop(0, 'rgba(244,56,56,0.25)');
                gradient.addColorStop(1, 'rgba(244,56,56,0.01)');
                return gradient;
              },
              tension: 0.45,
              fill: true,
              pointRadius: 0,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: interfaceColors.enp7s0,
              borderWidth: 2,
              clip: false,
            },
            {
              // Débit de l'interface enp4s0.

              label: 'enp4s0',
              data: variationData.enp4s0,
              borderColor: interfaceColors.enp4s0,
              backgroundColor: (ctx) => {
                const chart = ctx.chart;
                const { ctx: c, chartArea } = chart;
                if (!chartArea) return 'transparent';
                const gradient = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                gradient.addColorStop(0, 'rgba(126,251,92,0.20)');
                gradient.addColorStop(1, 'rgba(126,251,92,0.01)');
                return gradient;
              },
              tension: 0.45,
              fill: true,
              pointRadius: 0,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: interfaceColors.enp4s0,
              borderWidth: 2,
              clip: false,
            },
            {
              // Ligne horizontale représentant le seuil critique.

              label: 'Seuil critique',
              data: thresholdData,
              borderColor: 'rgba(239,68,68,0.55)',
              borderDash: [5, 4],
              borderWidth: 1.5,
              pointRadius: 0,
              fill: false,
              tension: 0,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 300, easing: 'easeOutQuart' },
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              // Configuration de l'infobulle affichée au survol.

              backgroundColor: 'rgba(0,25,37,0.95)',
              borderColor: 'rgba(202,244,56,0.2)',
              borderWidth: 1,
              titleColor: '#CAF438',
              bodyColor: '#e8f5e2',
              padding: 10,
              cornerRadius: 8,
              callbacks: {
                label: ctx => {
                  if (ctx.datasetIndex === 0 || ctx.datasetIndex === 1) {
                    return ` ${ctx.dataset.label} : ${ctx.parsed.y.toFixed(2)} Mbps`;
                  }
                  return ` Seuil : ${ctx.parsed.y.toFixed(2)} Mbps`;
                }
              }
            }
          },
          scales: {
            // Configuration de l'axe vertical
            y: {
              min: 0,
              max: MAX_BW_MBPS,
              ticks: {
                color: 'rgba(232,245,226,0.35)',
                font: { size: 10 },
                stepSize: 200,
                callback: v => v + ' Mbps'
              },
              grid: { color: 'rgba(202,244,56,0.06)', drawBorder: false },
              border: { display: false },
            },
            // Configuration de l'axe horizontal
            x: {
              ticks: { color: 'rgba(232,245,226,0.35)', font: { size: 10 } },
              grid: { display: false },
              border: { display: false },
            }
          }
        }
      });

      // Met à jour le texte affichant le débit actuel des deux interfaces
      function refreshInterfaceStats() {
        const currentEl = document.getElementById('bw-current');
        if (currentEl) {
          const lastEnp7s0 = variationData.enp7s0[variationData.enp7s0.length - 1];
          const lastEnp4s0 = variationData.enp4s0[variationData.enp4s0.length - 1];
          currentEl.textContent = `enp7s0   ${Number(lastEnp7s0).toFixed(2)} Mbps   |   enp4s0   ${Number(lastEnp4s0).toFixed(2)} Mbps`;
        }
      }

      refreshInterfaceStats();

      // ── WebSocket : réception des données réseau en temps réel
      function setupNetmetricsWS() {
        // Utilise ws en HTTP et wss en HTTPS.
        const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = wsProto + '://' + location.hostname + ':8000/ws/netmetrics';
        let ws;
        try {
          ws = new WebSocket(wsUrl);
        } catch (e) {
          console.error('WebSocket init failed', e);
          return;
        }
        ws.onopen = () => console.log('netmetrics ws open');
        ws.onclose = () => console.log('netmetrics ws closed');
        ws.onerror = (e) => console.error('netmetrics ws error', e);
        ws.onmessage = (ev) => {
          try {
            const payload = JSON.parse(ev.data);
            // payload: { ts: <num>, data: {iface: value, ...} }
            const data = payload.data || {};
            console.log('[netmetrics] received:', data);

            // Récupère les débits des deux interfaces
            const enp7s0Mbps = Number(data.enp7s0 ?? data['enp7s0']) || 0;
            const enp4s0Mbps = Number(data.enp4s0 ?? data['enp4s0']) || 0;

            // Empêche une valeur reçue de dépasser le maximum
            const enp7s0Value = Math.min(MAX_BW_MBPS, enp7s0Mbps);
            const enp4s0Value = Math.min(MAX_BW_MBPS, enp4s0Mbps);

            // Ajoute les nouvelles valeurs et supprime les plus anciennes
            variationData.enp7s0.push(enp7s0Value);
            variationData.enp7s0.shift();
            variationData.enp4s0.push(enp4s0Value);
            variationData.enp4s0.shift();

            variationLabels.shift();
            variationLabels.push('');

            // Met à jour les valeurs affichées à côté du graphique
            refreshInterfaceStats();

            // Met à jour les données du graphique
            if (variationChart && variationChart.data && variationChart.data.datasets && variationChart.data.datasets[0]) {
              variationChart.data.datasets[0].data = variationData.enp7s0;
              variationChart.data.datasets[1].data = variationData.enp4s0;
              variationChart.update('none');
            }
          } catch (err) {
            console.error('failed to parse netmetrics message', err);
          }
        };
      }
      setTimeout(setupNetmetricsWS, 500);
    }

    // ── Graphique de bande passante
    const ctx = document.getElementById('bandwidthChart');
    if (ctx) {

      // Données statiques
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['00h', '02h', '04h', '06h', '08h', '10h', '12h', '14h', '16h', '18h', '20h', '22h'],
          datasets: [
            {
              label: 'Upload (Mbps)',
              data: [12, 19, 8, 15, 22, 18, 25, 20, 28, 24, 30, 22],
              borderColor: '#7efb5c',
              backgroundColor: 'rgba(126,251,92,0.07)',
              tension: 0.4,
              fill: true,
              pointBackgroundColor: '#7efb5c',
              pointRadius: 3,
              pointHoverRadius: 5,
              borderWidth: 2,
            },
            {
              label: 'Download (Mbps)',
              data: [28, 32, 25, 35, 42, 38, 45, 40, 52, 48, 55, 50],
              borderColor: '#CAF438',
              backgroundColor: 'rgba(255,165,0,0.07)',
              tension: 0.4,
              fill: true,
              pointBackgroundColor: '#CAF438',
              pointRadius: 3,
              pointHoverRadius: 5,
              borderWidth: 2,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(0,25,37,0.95)',
              borderColor: 'rgba(202,244,56,0.2)',
              borderWidth: 1,
              titleColor: '#CAF438',
              bodyColor: '#e8f5e2',
              padding: 10,
              cornerRadius: 8,
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 80,
              ticks: { color: 'rgba(232,245,226,0.4)', font: { size: 11 }, stepSize: 20 },
              grid: { color: 'rgba(202,244,56,0.06)', drawBorder: false },
              border: { display: false },
            },
            x: {
              ticks: { color: 'rgba(232,245,226,0.4)', font: { size: 11 } },
              grid: { display: false },
              border: { display: false },
            }
          }
        }
      });
    }
  } // end initDashboard

  // Fonction pour update la table quota_machine 
  function updateTableQuota() {
    if (confirm('Êtes-vous sûr de faire une MAJ de quota_machine ?')) {
      fetch('http://localhost:8000/api/quota/update-table', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            alert('✓ Succès: ');
            location.reload();
          } else {
            alert('✗ Erreur: ' + result.message);
          }
        })
        .catch(error => {
          alert('✗ Erreur de connexion: ' + error.message);
          console.error(error);
        });
    }
  }

  // Fonction pour réinitialiser le quota de TOUTES les machines
  function resetAllQuotas() {
    if (confirm('Êtes-vous sûr de vouloir réinitialiser le quota de TOUTES les machines ?')) {
      fetch('http://localhost:8000/api/quota/reset-all', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            alert('✓ Succès: ' + result.message + ' (' + result.machines_updated + ' machines)');
            location.reload();
          } else {
            alert('✗ Erreur: ' + result.message);
          }
        })
        .catch(error => {
          alert('✗ Erreur de connexion: ' + error.message);
          console.error(error);
        });
    }
  }

  // Called via eval() after DOM injection — wait for layout + Chart.js
  requestAnimationFrame(() => requestAnimationFrame(() => loadChartJS(initDashboard)));
</script>
